# TEMPLATE ONLY: inspect blog mounts, certificate paths and 443 publishing before installing.
# Keep original blog server blocks unchanged. No catch-all/default server here.
limit_req_zone $binary_remote_addr zone=dy_license_api:10m rate=60r/m;
server {
    listen 80;
    server_name license.txblog.cn;
    client_max_body_size 64k;
    location /.well-known/acme-challenge/ {
        root /var/www/license-acme;
    }
    location / {
        return 301 https://license.txblog.cn$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name license.txblog.cn;
    ssl_certificate /etc/letsencrypt/live/license.txblog.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.txblog.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/v1/ {
        limit_req zone=dy_license_api burst=20 nodelay;
        limit_req_status 429;
        set $license_api_upstream http://license-api:8000;
        proxy_pass $license_api_upstream;
        proxy_set_header Host license.txblog.cn;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / {
        set $license_upstream http://license-api:8000;
        proxy_pass $license_upstream;
        proxy_set_header Host license.txblog.cn;
        # No forwarded-header trust in application. Never pass caller-controlled proxy identity.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
