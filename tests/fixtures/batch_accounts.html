<!doctype html><meta charset="utf-8"><style>.iHAKgO8B{width:240px;height:50px;background:pink}input{width:80px}</style>
<button>全部商品</button><ul><li>1 <span data-e2e="promotion-title" onclick="openDetail()">测试球</span> ¥20 <button data-e2e="shop-buyBtn">去抢购</button></li></ul><main></main>
<script>
const mode=new URLSearchParams(location.search).get('mode')||'success';
function openDetail(){document.querySelector('main').innerHTML='<section><h3>测试球</h3><p>订单留言</p><label>购买数量 <input type="number" min="1" value="1"></label><div class="iHAKgO8B">支付 ¥20.00</div></section>';const q=document.querySelector('input'),b=document.querySelector('.iHAKgO8B');q.oninput=()=>b.textContent='支付 ¥'+(20*Number(q.value)).toFixed(2);b.onclick=async()=>{b.style.pointerEvents='none';const n=Number(q.value);const data=await fetch('/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quantity:n,mode})}).then(r=>r.json());sessionStorage.setItem('detail','1');document.querySelector('main').innerHTML='<section><h3>待付款</h3><p>订单号：'+data.id+'</p><p>商品名称：'+(mode==='wrong_product'?'其他商品':'测试球')+'</p><p>购买数量：'+(mode==='wrong_quantity'?n+1:n)+'</p>'+(mode==='missing'?'':mode==='wrong_spec'?'<p>规格：其他规格</p>':'<p>规格：默认单一规格</p>')+'<button onclick="console.log("FORBIDDEN")">放弃支付</button><button aria-label="关闭" onclick="console.log("FORBIDDEN")">×</button></section>';if(mode==='ambiguous')document.querySelector('main').innerHTML+='<section><h3>待付款</h3><p>订单号：OTHER123456</p></section>';};}
if(sessionStorage.getItem('detail')&&mode!=='fallback')openDetail();
</script>
