# Include ONLY inside license.txblog.cn's HTTPS server. Public mount is read-only.
location = /updates/stable/latest.json {
    alias /srv/dy-updates/stable/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}
location ~ ^/updates/releases/([0-9]+\.[0-9]+\.[0-9]+)/((DYLiveAssistant-[0-9]+\.[0-9]+\.[0-9]+-windows-x64)\.zip)$ {
    alias /srv/dy-updates/releases/$1/$2;
    default_type application/zip;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location = /updates/stable/incremental.json {
    alias /srv/dy-updates/stable/incremental.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}
location ~ ^/updates/releases/([0-9]+\.[0-9]+\.[0-9]+)/(incremental-[0-9]+\.[0-9]+\.[0-9]+\.json)$ {
    alias /srv/dy-updates/releases/$1/$2;
    default_type application/json;
}
location ~ ^/updates/releases/([0-9]+\.[0-9]+\.[0-9]+)/(DYLiveAssistant-[0-9]+\.[0-9]+\.[0-9]+-to-[0-9]+\.[0-9]+\.[0-9]+-windows-x64\.zip)$ {
    alias /srv/dy-updates/releases/$1/$2;
    default_type application/zip;
}
location /updates/ {
    return 404;
}
